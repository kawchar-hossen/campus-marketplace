{% extends "base.html" %}

{% block content %}

<div class="add-product-page">

    <div class="add-product-box">

        <div class="form-header">
            <h2>Add New Product</h2>
            <p>Sell your product on Campus Marketplace</p>
        </div>

        <form method="POST" enctype="multipart/form-data" class="product-form">

            <div class="form-group">
                <label>Product Title</label>
                <input type="text" name="title" placeholder="e.g. MacBook Pro 2020" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea name="description" rows="4" placeholder="Write product details..."></textarea>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label>Price (৳)</label>
                    <input type="number" step="0.01" name="price" placeholder="Enter price" required>
                </div>

                <div class="form-group">
                    <label>Category</label>
                    <input type="text" name="category" placeholder="Laptop, Book, Phone">
                </div>

            </div>

            <div class="form-group">
                <label>Product Image</label>
                <input type="file" name="image" class="file-input">
            </div>

            <button type="submit" class="btn-submit">
                ➕ Add Product
            </button>

        </form>

    </div>

</div>

{% endblock %}
