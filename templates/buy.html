<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Buy Product</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: #f5f6fa;
        }

        .buy-card {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        .title {
            text-align: center;
            margin-bottom: 20px;
            font-weight: bold;
        }

        .payment-option {
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: 0.2s;
        }

        .payment-option:hover {
            border-color: #0d6efd;
            background: #f0f6ff;
        }

        .payment-option input {
            margin-right: 10px;
        }

        .btn-buy {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            border-radius: 10px;
        }

        .note {
            font-size: 13px;
            color: gray;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<div class="buy-card">

    <h3 class="title">🛒 Buy Product</h3>

    <form method="POST">

        <!-- COD -->
        <label class="payment-option d-flex align-items-center">
            <input type="radio" name="payment_method" value="cod" required>
            <div>
                <strong>Cash on Delivery</strong><br>
                <small>Pay after receiving the product (Campus only)</small>
            </div>
        </label>

        <!-- BKASH -->
        <label class="payment-option d-flex align-items-center">
            <input type="radio" name="payment_method" value="bkash">
            <div>
                <strong>bKash / Nagad Payment</strong><br>
                <small>Pay online and submit Transaction ID (TrxID)</small>
            </div>
        </label>

        <br>

        <button type="submit" class="btn btn-primary btn-buy">
            Place Order
        </button>

        <p class="note">
            ⚠️ For online payment, you will see seller bKash/Nagad number after placing order.
        </p>

    </form>

</div>

</body>
</html>
