{% extends "base.html" %}

{% block content %}

<div class="chat-page">

    <div class="chat-container">

        <!-- Chat Header -->
        <div class="chat-header">
            <h2>Chat with {{ other_user.full_name }}</h2>
            <p>Send and receive messages instantly</p>
        </div>

        <!-- Message Area -->
        <div id="messages" class="chat-messages">

            {% for msg in messages %}
                <div class="message-item {% if msg.sender_id == current_user.id %}my-message{% else %}other-message{% endif %}">

                    <strong>
                        {% if msg.sender_id == current_user.id %}
                            You
                        {% else %}
                            {{ other_user.full_name }}
                        {% endif %}
                    </strong>

                    <br>

                    {{ msg.text }}

                </div>
            {% endfor %}

        </div>

        <!-- Input Section -->
        <div class="chat-input-area">

            <input
                type="text"
                id="message_input"
                placeholder="Type your message..."
                autocomplete="off"
            >

            <button
                type="button"
                onclick="sendMessage()"
                class="btn-send"
            >
                Send
            </button>

        </div>

    </div>

</div>


<!-- Socket.IO -->
<script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>

<!-- Chat Script -->
<script>
    const receiverId = {{ other_user.id }};
    const currentUserId = {{ current_user.id }};
</script>

<script src="{{ url_for('static', filename='js/chat.js') }}"></script>

{% endblock %}
