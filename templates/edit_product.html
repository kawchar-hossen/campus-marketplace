{% extends "base.html" %}

{% block content %}

<section class="edit-product-page">
    <div class="edit-product-container">

        <div class="edit-header">
            <h2>Edit Product</h2>
            <p>Update your product information below.</p>
        </div>

        <form method="POST" class="edit-product-form">

            <div class="form-group">
                <label for="title">Product Title</label>
                <input
                    type="text"
                    id="title"
                    name="title"
                    value="{{ product.title }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea
                    id="description"
                    name="description"
                    rows="5"
                >{{ product.description }}</textarea>
            </div>

            <div class="form-row">

                <div class="form-group">
                    <label for="price">Price</label>
                    <input
                        type="number"
                        step="0.01"
                        id="price"
                        name="price"
                        value="{{ product.price }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="category">Category</label>
                    <input
                        type="text"
                        id="category"
                        name="category"
                        value="{{ product.category }}"
                    >
                </div>

            </div>

            <div class="edit-actions">
                <a href="{{ url_for('product.product_detail', id=product.id) }}" class="btn-cancel">
                    Cancel
                </a>

                <button type="submit" class="btn-update">
                    Update Product
                </button>
            </div>

        </form>

    </div>
</section>

{% endblock %}
