{% extends "base.html" %}

{% block content %}

<h2 class="mb-4">Products</h2>

<!-- Filter Form -->
<form method="GET" class="row g-2 mb-4">

    <div class="col-md-4">
        <input type="text" class="form-control" name="search" placeholder="Search products..." value="{{ search }}">
    </div>

    <div class="col-md-3">
        <input type="text" class="form-control" name="category" placeholder="Category" value="{{ category }}">
    </div>

    <div class="col-md-3">
        <input type="number" step="0.01" class="form-control" name="max_price" placeholder="Max Price" value="{{ max_price }}">
    </div>

    <div class="col-md-2">
        <button class="btn btn-primary w-100">Filter</button>
    </div>

</form>

<!-- Action Buttons -->
<div class="mb-4">
    <a href="/product/add" class="btn btn-success btn-sm">Sell Product</a>
    <a href="/wishlist" class="btn btn-outline-secondary btn-sm">My Wishlist</a>
</div>

<!-- Product Grid -->
<div class="row">

    {% for product in products %}

    <div class="col-md-4 mb-4">

        <div class="card h-100 shadow-sm">

            <img src="{{ url_for('static', filename='images/' ~ (product.image or 'default_product.png')) }}"
     alt="Product Image">
            <div class="card-body">

                <h5 class="card-title">{{ product.title }}</h5>

                <p class="text-muted mb-1">{{ product.category }}</p>

                <p class="fw-bold text-success">{{ product.price }} BDT</p>

                <a href="/product/{{ product.id }}" class="btn btn-outline-primary btn-sm">
                    View
                </a>

                {% if current_user.is_authenticated %}
                <a href="/wishlist/add/{{ product.id }}" class="btn btn-outline-danger btn-sm">
                    ❤ Save
                </a>
                {% endif %}

            </div>

        </div>

    </div>

    {% endfor %}

</div>

{% endblock %}
