<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verify OTP</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Optional: Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            height: 100vh;
        }

        .otp-card {
            border: none;
            border-radius: 15px;
            padding: 30px;
            background: white;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }

        .otp-title {
            font-weight: 600;
            color: #1e293b;
        }

        .otp-input {
            font-size: 18px;
            text-align: center;
            letter-spacing: 8px;
        }

        .btn-verify {
            background: #22c55e;
            border: none;
        }

        .btn-verify:hover {
            background: #16a34a;
        }

        .subtitle {
            font-size: 14px;
            color: gray;
        }
    </style>
</head>

<body>

<div class="container d-flex justify-content-center align-items-center h-100">

    <div class="col-md-5">

        <div class="otp-card">

            <h3 class="text-center otp-title">OTP Verification</h3>

            <p class="text-center subtitle">
                Enter the 6-digit code sent to your email
            </p>

            <!-- Flash messages -->
            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST">

                <div class="mb-3">
                    <input type="text"
                           name="otp"
                           class="form-control otp-input"
                           maxlength="6"
                           placeholder="______"
                           required>
                </div>

                <button type="submit" class="btn btn-verify w-100 text-white">
                    Verify OTP
                </button>

            </form>

            <div class="text-center mt-3">
                <small>
                    Didn’t receive OTP?
                    <a href="#" class="text-success">Resend</a>
                </small>
            </div>

        </div>

    </div>

</div>

</body>
</html>
